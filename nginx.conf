server {
    listen 80;
    server_name chatudo.com www.chatudo.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /robots.txt { access_log off; }
    location = /sitemap.xml { access_log off; }

    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/img/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/meta/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /css/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Clean URLs: /pricing/ etc. serve pricing/index.html directly.
    # A request without the trailing slash (e.g. /pricing) gets nginx's
    # normal 301 to the slash form, which is the canonical URL to submit
    # to Meta (see README.md / docs/screenshots).
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
